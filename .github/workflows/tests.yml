name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python and the classifiers in pyproject.toml.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One spot-check per other platform. rasterio and geopandas ship
          # their own binaries, so platform breakage shows up as an import or
          # wheel failure rather than a logic error — a single version catches
          # it without tripling the matrix.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run offline tests
        # pyproject sets addopts = -m 'not network', so the 9 live tests are
        # deselected by default. CI must never hit Google's or Esri's endpoints:
        # they are rate-limited, non-deterministic, and their terms restrict
        # automated access. Run those locally, against small AOIs.
        run: pytest -q

  descriptors:
    # README: "--check verifies the committed blobs match proto/ without
    # writing, which is worth running in CI."
    name: descriptors match proto/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev — supplies protoc via grpcio-tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check descriptors are in sync
        run: python tools/regen_descriptors.py --check

[build-system]
# >=1.27 for PEP 639 (SPDX `license` expression + `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "old-imagery"
version = "0.1.0"
description = "Historical aerial imagery from Google Earth and Esri Wayback, as shapely-in / rasterio-out Python functions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "The old-imagery contributors" }]
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
keywords = ["gis", "aerial", "imagery", "google-earth", "esri", "wayback", "historical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

dependencies = [
    "protobuf>=4.21",
    "httpx>=0.24",
    "numpy>=1.23",
    "shapely>=2.0",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "pandas>=1.5",
    "affine>=2.3",
]

# GPL-3.0 distribution requires recipients be able to get the corresponding
# source; PyPI renders these as sidebar links.
[project.urls]
Homepage = "https://github.com/angusmcb/old-imagery"
Source = "https://github.com/angusmcb/old-imagery"
Issues = "https://github.com/angusmcb/old-imagery/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pyproj>=3.4"]
# grpcio-tools supplies protoc for tools/regen_descriptors.py.
dev = ["pytest>=7", "pyproj>=3.4", "grpcio-tools>=1.60", "ruff>=0.4", "build", "twine>=6.1"]

[tool.hatch.build.targets.wheel]
# _descriptors/*.desc live inside the package and are picked up automatically.
packages = ["src/old_imagery"]

[tool.hatch.build.targets.sdist]
# Ship the descriptor sources and the regeneration script: the .desc blobs in
# the wheel are build outputs, and GPL-3.0 means the sdist should carry the
# form a recipient would actually modify.
include = [
    "/src",
    "/tests",
    "/proto",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits live Google/Esri endpoints (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

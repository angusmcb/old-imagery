[build-system]
# >=1.27 for PEP 639 (SPDX `license` expression + `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "old-imagery"
version = "0.1.0"
description = "Historical aerial imagery from Google Earth and Esri Wayback, as shapely-in / rasterio-out Python functions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "The old-imagery contributors" }]
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
keywords = ["gis", "aerial", "imagery", "google-earth", "esri", "wayback", "historical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

dependencies = [
    "protobuf>=4.21",
    "httpx>=0.24",
    "numpy>=1.23",
    "shapely>=2.0",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "pandas>=1.5",
    "affine>=2.3",
]

# GPL-3.0 distribution requires recipients be able to get the corresponding
# source; PyPI renders these as sidebar links.
[project.urls]
Homepage = "https://github.com/angusmcb/old-imagery"
Source = "https://github.com/angusmcb/old-imagery"
Issues = "https://github.com/angusmcb/old-imagery/issues"

# The only published extra. Running examples/getting-started.ipynb needs
# matplotlib to draw the imagery and the seam maps, and the jupyter stack to
# execute the notebook — by hand, and in the network test that keeps it honest
# (tests/test_examples.py). The offline notebook tests read it as JSON and need
# none of this. It is an extra rather than a dependency group because the
# README tells readers to `pip install "old-imagery[examples]"`, so it has to
# be resolvable from PyPI.
[project.optional-dependencies]
examples = [
    "matplotlib>=3.6",
    "nbformat>=5.7",
    "nbclient>=0.7",
    "ipykernel>=6",
]

# Development tooling, as PEP 735 groups rather than extras. Groups are never
# published, so nobody can `pip install old-imagery[dev]` off PyPI and pull in
# ruff, mypy and pre-commit — that was always a packaging accident rather than
# something a consumer wanted.
#
#     uv sync                                      # dev, the default group
#     uv sync --no-default-groups --group test     # what CI installs
#     pip install -e . --group dev                 # pip 25.1+
#
# `--group test` on its own *adds* to the default groups rather than replacing
# them, which quietly installs the whole dev tree.
[dependency-groups]
test = ["pytest>=7", "pyproj>=3.4"]
# grpcio-tools supplies protoc for tools/regen_descriptors.py.
dev = [
    { include-group = "test" },
    "grpcio-tools>=1.60",
    # Floor kept in step with the pinned rev in .pre-commit-config.yaml.
    "ruff>=0.16",
    "mypy>=1.8",
    # Third-party stubs. affine and rasterio have none, and are handled by the
    # per-module overrides in [tool.mypy].
    "types-protobuf",
    "types-shapely",
    "types-geopandas",
    "pre-commit>=3.5",
    "build",
    "twine>=6.1",
    # Self-reference rather than a second copy of the list: two lists is one
    # that drifts. `examples` is an extra, so this is a plain requirement
    # string; include-group only reaches other groups.
    "old-imagery[examples]",
]

[tool.hatch.build.targets.wheel]
# _descriptors/*.desc live inside the package and are picked up automatically.
packages = ["src/old_imagery"]

[tool.hatch.build.targets.sdist]
# Ship the descriptor sources and the regeneration script: the .desc blobs in
# the wheel are build outputs, and GPL-3.0 means the sdist should carry the
# form a recipient would actually modify.
include = [
    "/src",
    "/tests",
    "/proto",
    "/tools",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits live Google/Esri endpoints (deselected by default)",
]
addopts = "-m 'not network'"

[tool.mypy]
# No python_version pin: numpy's bundled stubs use PEP 695 `type` statements,
# so pinning to our 3.10 floor makes mypy fail parsing numpy itself. mypy
# therefore follows the interpreter it runs under (3.12 in CI). The cost is
# that 3.10-specific typing problems are not caught here; the pytest matrix
# still exercises 3.10 at runtime.
# Scoped to shipped code. The test suite deliberately passes wrong types to
# assert the errors they raise, substitutes fake clients, and reaches for
# private attributes — type-checking it would fight what the tests are for.
files = ["src/old_imagery", "tools"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
strict_equality = true
no_implicit_reexport = true

# Not yet enabled: disallow_untyped_defs / disallow_any_generics. Turning on
# full `strict` today reports 61 errors, 38 of them missing annotations — a
# worthwhile ratchet, but a separate piece of work from setting up the check.

[[tool.mypy.overrides]]
# No stubs published and no py.typed marker upstream.
module = ["affine", "rasterio.*", "rasterio"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Ruff formats Python blocks inside Markdown. The README aligns trailing
# comments in its examples on purpose, and a formatter should not quietly
# rewrite prose, so keep it to real source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default set has widened across releases,
# and CI should not start failing because a new ruff shipped new rules.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade (py310+)
    "B",    # bugbear
    "SIM",  # simplify
    "BLE",  # blind except
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
]
ignore = [
    # __all__ is grouped by role (public API, constants, types, exceptions),
    # which carries more information than alphabetical order.
    "RUF022",
    # __slots__ mirrors the __init__ signature order; sorting would divorce it.
    "RUF023",
]

[tool.ruff.lint.isort]
known-first-party = ["old_imagery"]
